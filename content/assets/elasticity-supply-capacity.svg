  <path d="M515 206 L516.8 201.9 L518.5 197.5 L520.3 192.8 L522.1 187.9 L523.9 182.8 L525.6 177.4 L527.4 171.8 L529.2 165.9 L530.9 159.8 L532.7 153.4 L534.5 146.8 L536.2 140" stroke="#7fb3c8" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="175" cy="404" r="4.5" fill="#c97b84"/>
  <text class="tk" x="82" y="408" text-anchor="end">3</text>
  <circle cx="260" cy="382" r="4.5" fill="#c97b84"/>
  <text class="tk" x="82" y="386" text-anchor="end">4</text>
  <circle cx="515" cy="206" r="4.5" fill="#7fb3c8"/>
  <text class="tk" x="82" y="210" text-anchor="end">12</text>
  <circle cx="536.2" cy="140" r="4.5" fill="#7fb3c8"/>
  <text class="tk" x="82" y="144" text-anchor="end">15</text>
  <text class="tk" x="175" y="488" text-anchor="middle">100</text>
  <text class="tk" x="260" y="488" text-anchor="middle">200</text>
  <text class="tk" x="520" y="488" text-anchor="end">500</text>
  <text class="tk" x="532.2" y="488" text-anchor="start">525</text>
  <text class="lbl" x="175" y="285.2" style="fill:#c97b84">ELASTIC  (&gt; 1)</text>
  <text class="item" x="175" y="303.2">price +29 %, quantity +67 %</text>
  <text class="lbl" x="499.7" y="155.4" text-anchor="end" style="fill:#7fb3c8">INELASTIC  (&lt; 1)</text>
  <text class="item" x="499.7" y="173.4" text-anchor="end">price +22 %, quantity +5 %</text>
  <rect class="box" x="660" y="60" width="310" height="440" rx="10"/>
  <text class="h" x="680" y="92">CAPACITY BENDS</text>
  <text class="h" x="680" y="118">THE SUPPLY CURVE</text>
  <text class="item" x="680" y="148">The same firms and the same plants:</text>
  <text class="item" x="680" y="166">what a price rise brings depends on</text>
  <text class="item" x="680" y="184">how much capacity is still idle.</text>
  <text class="lbl" x="680" y="216" style="fill:#c97b84">IDLE CAPACITY</text>
  <text class="item" x="680" y="242">Price 3 → 4 raises output from 100</text>
  <text class="item" x="680" y="260">to 200. Elasticity 2.3: supply is</text>
  <text class="item" x="680" y="278">elastic.</text>
  <text class="lbl" x="680" y="310" style="fill:#7fb3c8">NEAR FULL CAPACITY</text>
  <text class="item" x="680" y="336">Price 12 → 15 raises output from 500</text>
  <text class="item" x="680" y="354">to 525. Elasticity 0.2: supply is</text>
  <text class="item" x="680" y="372">inelastic.</text>
  <text class="lbl" x="680" y="404" style="fill:#d4a84b">OVER TIME</text>
  <text class="item" x="680" y="430">New plants move the capacity limit</text>
  <text class="item" x="680" y="448">to the right. Long-run supply is more</text>
  <text class="item" x="680" y="466">elastic than short-run supply.</text>
  <text class="src" x="970" y="536" text-anchor="end">After Mankiw, Principles of Economics, ch. 5. Drawn for LIBEROS.</text>
</svg>
