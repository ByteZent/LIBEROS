<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="t d">
  <title id="t">Four basic shifts of supply and demand</title>
  <desc id="d">Four panels. Demand rises (for example a hot summer for ice cream): demand shifts right, price and quantity rise. Demand falls (for example a complement becomes more expensive): price and quantity fall. Supply rises (for example cheaper technology): supply shifts right, price falls and quantity rises. Supply falls (for example a dearer input): supply shifts left, price rises and quantity falls.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6773"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9d1d9"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7fb3c8"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fc59b"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4a84b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c97b84"/></marker>
    <style>
      .panel { fill: #0d1117; }
      .box { fill: #161d26; stroke: #3a4654; stroke-width: 1.5; }
      .axis { stroke: #5b6773; stroke-width: 1.5; fill: none; }
      .guide { stroke: #5b6773; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
      .d { stroke: #7fb3c8; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .s { stroke: #8fc59b; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .old { stroke-dasharray: 7 6; opacity: .55; }
      .h { font: 700 15px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.5px; fill: #e8edf2; }
      .lbl { font: 600 11.5px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.2px; }
      .ax { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .cv { font: italic 700 14px "IBM Plex Serif", Georgia, serif; }
      .tk { font: italic 13px "IBM Plex Serif", Georgia, serif; fill: #c9d1d9; }
      .item { font: 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
      .sub { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .res { font: 700 13px "JetBrains Mono", Menlo, monospace; fill: #d4a84b; }
      .src { font: italic 11px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #5b6773; }
    </style>
  </defs>
  <rect class="panel" width="1000" height="760" rx="14"/>
  <rect class="box" x="30" y="30" width="455" height="335" rx="10"/>
  <text class="h" x="50" y="62">DEMAND RISES</text>
  <text class="sub" x="50" y="82">e.g. hot summer → ice cream</text>
  <text class="res" x="465" y="62" text-anchor="end">P↑  Q↑</text>
  <path class="axis" d="M90 322 V120" marker-end="url(#ax)"/>
  <path class="axis" d="M90 322 H402" marker-end="url(#ax)"/>
  <text class="ax" x="82" y="112">P</text>
  <text class="ax" x="402" y="344" text-anchor="end">Q</text>
  <path class="s" d="M102.0 296.9 L375.0 158.6"/>
  <text class="cv" x="381.0" y="158.6" fill="#8fc59b">S</text>
  <path class="d old" d="M108.0 160.1 L390.0 303.0"/>
  <text class="cv" x="396.0" y="299.0" fill="#7fb3c8" opacity=".6">D₀</text>
  <path class="d" d="M113.6 132.6 L390.0 272.6"/>
  <text class="cv" x="396.0" y="268.6" fill="#7fb3c8">D₁</text>
  <path d="M186.0 196.6 L229.5 196.6" stroke="#7fb3c8" stroke-width="1.8" fill="none" marker-end="url(#ad)"/>
  <path class="guide" d="M90 227.0 H240.0 V322"/>
  <circle cx="240.0" cy="227.0" r="4" fill="#5b6773"/>
  <path class="guide" d="M90 211.8 H270.0 V322"/>
  <circle cx="270.0" cy="211.8" r="5" fill="#d4a84b"/>
  <rect class="box" x="515" y="30" width="455" height="335" rx="10"/>
  <text class="h" x="535" y="62">DEMAND FALLS</text>
  <text class="sub" x="535" y="82">e.g. complement gets dearer</text>
  <text class="res" x="950" y="62" text-anchor="end">P↓  Q↓</text>
  <path class="axis" d="M575 322 V120" marker-end="url(#ax)"/>
  <path class="axis" d="M575 322 H887" marker-end="url(#ax)"/>
  <text class="ax" x="567" y="112">P</text>
  <text class="ax" x="887" y="344" text-anchor="end">Q</text>
  <path class="s" d="M587.0 296.9 L860.0 158.6"/>
  <text class="cv" x="866.0" y="158.6" fill="#8fc59b">S</text>
  <path class="d old" d="M593.0 160.1 L875.0 303.0"/>
  <text class="cv" x="881.0" y="299.0" fill="#7fb3c8" opacity=".6">D₀</text>
  <path class="d" d="M593.0 190.5 L829.9 310.5"/>
  <text class="cv" x="835.9" y="320.5" fill="#7fb3c8">D₁</text>
  <path d="M659.0 196.6 L615.5 196.6" stroke="#7fb3c8" stroke-width="1.8" fill="none" marker-end="url(#ad)"/>
  <path class="guide" d="M575 227.0 H725.0 V322"/>
  <circle cx="725.0" cy="227.0" r="4" fill="#5b6773"/>
  <path class="guide" d="M575 242.2 H695.0 V322"/>
  <circle cx="695.0" cy="242.2" r="5" fill="#d4a84b"/>
  <rect class="box" x="30" y="390" width="455" height="335" rx="10"/>
  <text class="h" x="50" y="422">SUPPLY RISES</text>
  <text class="sub" x="50" y="442">e.g. cheaper technology</text>
  <text class="res" x="465" y="422" text-anchor="end">P↓  Q↑</text>
  <path class="axis" d="M90 682 V480" marker-end="url(#ax)"/>
  <path class="axis" d="M90 682 H402" marker-end="url(#ax)"/>
  <text class="ax" x="82" y="472">P</text>
  <text class="ax" x="402" y="704" text-anchor="end">Q</text>
  <path class="d" d="M108.0 520.1 L390.0 663.0"/>
  <text class="cv" x="396.0" y="673.0" fill="#7fb3c8">D</text>
  <path class="s old" d="M90.0 663.0 L390.0 511.0"/>
  <text class="cv" x="396.0" y="515.0" fill="#8fc59b" opacity=".6">S₀</text>
  <path class="s" d="M132.0 672.1 L390.0 541.4"/>
  <text class="cv" x="396.0" y="545.4" fill="#8fc59b">S₁</text>
  <path d="M186.0 617.4 L229.5 617.4" stroke="#8fc59b" stroke-width="1.8" fill="none" marker-end="url(#as)"/>
  <path class="guide" d="M90 587.0 H240.0 V682"/>
  <circle cx="240.0" cy="587.0" r="4" fill="#5b6773"/>
  <path class="guide" d="M90 602.2 H270.0 V682"/>
  <circle cx="270.0" cy="602.2" r="5" fill="#d4a84b"/>
  <rect class="box" x="515" y="390" width="455" height="335" rx="10"/>
  <text class="h" x="535" y="422">SUPPLY FALLS</text>
  <text class="sub" x="535" y="442">e.g. input gets dearer</text>
  <text class="res" x="950" y="422" text-anchor="end">P↑  Q↓</text>
  <path class="axis" d="M575 682 V480" marker-end="url(#ax)"/>
  <path class="axis" d="M575 682 H887" marker-end="url(#ax)"/>
  <text class="ax" x="567" y="472">P</text>
  <text class="ax" x="887" y="704" text-anchor="end">Q</text>
  <path class="d" d="M593.0 520.1 L875.0 663.0"/>
  <text class="cv" x="881.0" y="673.0" fill="#7fb3c8">D</text>
  <path class="s old" d="M575.0 663.0 L875.0 511.0"/>
  <text class="cv" x="881.0" y="515.0" fill="#8fc59b" opacity=".6">S₀</text>
  <path class="s" d="M575.0 632.6 L851.0 492.8"/>
  <text class="cv" x="857.0" y="490.8" fill="#8fc59b">S₁</text>
  <path d="M659.0 617.4 L615.5 617.4" stroke="#8fc59b" stroke-width="1.8" fill="none" marker-end="url(#as)"/>
  <path class="guide" d="M575 587.0 H725.0 V682"/>
  <circle cx="725.0" cy="587.0" r="4" fill="#5b6773"/>
  <path class="guide" d="M575 571.8 H695.0 V682"/>
  <circle cx="695.0" cy="571.8" r="5" fill="#d4a84b"/>
  <text class="src" x="970" y="746" text-anchor="end">Faded curve and grey dot: before. Gold dot: new equilibrium. After Mankiw, Principles of Economics, ch. 4. Drawn for LIBEROS.</text>
</svg>
