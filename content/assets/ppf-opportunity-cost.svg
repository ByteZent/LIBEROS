<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">Constant vs increasing opportunity cost</title>
  <desc id="d">Two production possibilities frontiers. Left: a straight line, where each extra 2 units of butter always cost 1.5 units of guns: constant opportunity cost. Right: a bowed-out curve, where each extra 2 units of butter cost 0.2, then 0.6, then 1.2, then 4.0 units of guns: increasing opportunity cost, because resources are not equally suited to producing both goods.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6773"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9d1d9"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7fb3c8"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fc59b"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4a84b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c97b84"/></marker>
    <style>
      .panel { fill: #0d1117; }
      .box { fill: #161d26; stroke: #3a4654; stroke-width: 1.5; }
      .axis { stroke: #5b6773; stroke-width: 1.5; fill: none; }
      .guide { stroke: #5b6773; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
      .d { stroke: #7fb3c8; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .s { stroke: #8fc59b; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .old { stroke-dasharray: 7 6; opacity: .55; }
      .h { font: 700 15px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.5px; fill: #e8edf2; }
      .lbl { font: 600 11.5px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.2px; }
      .ax { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .cv { font: italic 700 14px "IBM Plex Serif", Georgia, serif; }
      .tk { font: italic 13px "IBM Plex Serif", Georgia, serif; fill: #c9d1d9; }
      .item { font: 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
      .sub { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .res { font: 700 13px "JetBrains Mono", Menlo, monospace; fill: #d4a84b; }
      .src { font: italic 11px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #5b6773; }
    </style>
  </defs>
  <rect class="panel" width="1000" height="560" rx="14"/>
  <rect class="box" x="30" y="30" width="455" height="440" rx="10"/>
  <text class="h" x="50" y="62">STRAIGHT LINE</text>
  <text class="sub" x="50" y="82">resources equally suited to both goods</text>
  <path class="axis" d="M100 410 V108" marker-end="url(#ax)"/>
  <path class="axis" d="M100 410 H442" marker-end="url(#ax)"/>
  <text class="ax" x="92" y="100">Guns</text>
  <text class="ax" x="442" y="432" text-anchor="end">Butter</text>
  <path d="M100.0 236.0 L103.3 238.2 L106.6 240.4 L109.9 242.5 L113.2 244.7 L116.5 246.9 L119.8 249.1 L123.1 251.2 L126.4 253.4 L129.7 255.6 L133.0 257.8 L136.3 259.9 L139.6 262.1 L142.9 264.3 L146.2 266.4 L149.5 268.6 L152.8 270.8 L156.1 273.0 L159.4 275.1 L162.7 277.3 L166.0 279.5 L169.3 281.7 L172.6 283.9 L175.9 286.0 L179.2 288.2 L182.5 290.4 L185.8 292.6 L189.1 294.7 L192.4 296.9 L195.7 299.1 L199.0 301.2 L202.3 303.4 L205.6 305.6 L208.9 307.8 L212.2 309.9 L215.5 312.1 L218.8 314.3 L222.1 316.5 L225.4 318.6 L228.7 320.8 L232.0 323.0 L235.3 325.2 L238.6 327.4 L241.9 329.5 L245.2 331.7 L248.5 333.9 L251.8 336.1 L255.1 338.2 L258.4 340.4 L261.7 342.6 L265.0 344.8 L268.3 346.9 L271.6 349.1 L274.9 351.3 L278.2 353.5 L281.5 355.6 L284.8 357.8 L288.1 360.0 L291.4 362.1 L294.7 364.3 L298.0 366.5 L301.3 368.7 L304.6 370.9 L307.9 373.0 L311.2 375.2 L314.5 377.4 L317.8 379.5 L321.1 381.7 L324.4 383.9 L327.7 386.1 L331.0 388.2 L334.3 390.4 L337.6 392.6 L340.9 394.8 L344.2 397.0 L347.5 399.1 L350.8 401.3 L354.1 403.5 L357.4 405.6 L360.7 407.8 L364.0 410.0" class="d"/>
  <path d="M100.0 236.0 H166.0 V279.5" stroke="#d4a84b" stroke-width="1.6" fill="none"/>
  <text class="sub" x="172.0" y="261.8" text-anchor="start" style="fill:#d4a84b">−1.5</text>
  <path d="M166.0 279.5 H232.0 V323.0" stroke="#d4a84b" stroke-width="1.6" fill="none"/>
  <text class="sub" x="238.0" y="305.2" text-anchor="start" style="fill:#d4a84b">−1.5</text>
  <path d="M232.0 323.0 H298.0 V366.5" stroke="#d4a84b" stroke-width="1.6" fill="none"/>
  <text class="sub" x="304.0" y="348.8" text-anchor="start" style="fill:#d4a84b">−1.5</text>
  <path d="M298.0 366.5 H364.0 V410.0" stroke="#d4a84b" stroke-width="1.6" fill="none"/>
  <text class="sub" x="370.0" y="392.2" text-anchor="start" style="fill:#d4a84b">−1.5</text>
  <text class="res" x="257" y="455" text-anchor="middle">constant opportunity cost</text>
  <rect class="box" x="515" y="30" width="455" height="440" rx="10"/>
  <text class="h" x="535" y="62">BOWED OUTWARD</text>
  <text class="sub" x="535" y="82">resources specialised (typical case)</text>
  <path class="axis" d="M585 410 V108" marker-end="url(#ax)"/>
  <path class="axis" d="M585 410 H927" marker-end="url(#ax)"/>
  <text class="ax" x="577" y="100">Guns</text>
  <text class="ax" x="927" y="432" text-anchor="end">Butter</text>
  <path d="M585.0 236.0 L588.3 236.0 L591.6 236.1 L594.9 236.1 L598.2 236.2 L601.5 236.3 L604.8 236.5 L608.1 236.7 L611.4 236.9 L614.7 237.1 L618.0 237.4 L621.3 237.7 L624.6 238.0 L627.9 238.3 L631.2 238.7 L634.5 239.1 L637.8 239.5 L641.1 240.0 L644.4 240.5 L647.7 241.0 L651.0 241.5 L654.3 242.1 L657.6 242.7 L660.9 243.3 L664.2 244.0 L667.5 244.7 L670.8 245.4 L674.1 246.2 L677.4 247.0 L680.7 247.8 L684.0 248.7 L687.3 249.6 L690.6 250.5 L693.9 251.5 L697.2 252.5 L700.5 253.5 L703.8 254.6 L707.1 255.7 L710.4 256.9 L713.7 258.1 L717.0 259.3 L720.3 260.6 L723.6 261.9 L726.9 263.3 L730.2 264.7 L733.5 266.1 L736.8 267.6 L740.1 269.2 L743.4 270.8 L746.7 272.5 L750.0 274.2 L753.3 275.9 L756.6 277.8 L759.9 279.7 L763.2 281.6 L766.5 283.6 L769.8 285.7 L773.1 287.9 L776.4 290.2 L779.7 292.5 L783.0 294.9 L786.3 297.4 L789.6 300.0 L792.9 302.8 L796.2 305.6 L799.5 308.6 L802.8 311.7 L806.1 314.9 L809.4 318.3 L812.7 321.9 L816.0 325.8 L819.3 329.8 L822.6 334.2 L825.9 338.8 L829.2 343.9 L832.5 349.5 L835.8 355.7 L839.1 362.8 L842.4 371.3 L845.7 382.6 L849.0 410.0" class="d"/>
  <path d="M585.0 236.0 H651.0 V241.5" stroke="#d4a84b" stroke-width="1.6" fill="none"/>
  <text class="sub" x="657.0" y="230.8" text-anchor="start" style="fill:#d4a84b">−0.2</text>
  <path d="M651.0 241.5 H717.0 V259.3" stroke="#d4a84b" stroke-width="1.6" fill="none"/>
  <text class="sub" x="723.0" y="254.4" text-anchor="start" style="fill:#d4a84b">−0.6</text>
  <path d="M717.0 259.3 H783.0 V294.9" stroke="#d4a84b" stroke-width="1.6" fill="none"/>
  <text class="sub" x="789.0" y="281.1" text-anchor="start" style="fill:#d4a84b">−1.2</text>
  <path d="M783.0 294.9 H849.0 V410.0" stroke="#d4a84b" stroke-width="1.6" fill="none"/>
  <text class="sub" x="855.0" y="356.5" text-anchor="start" style="fill:#d4a84b">−4.0</text>
  <text class="res" x="742" y="455" text-anchor="middle">increasing opportunity cost</text>
  <text class="item" x="30" y="506">Each step adds <tspan fill="#d4a84b" font-weight="700">2 units of butter</tspan>; the gold numbers are the guns given up for it.</text>
  <text class="item" x="30" y="526">Bowed out: the first resources moved (farmland) suit butter well; the last ones (arms engineers) are poor farmers, so each step costs more guns.</text>
  <text class="src" x="970" y="548" text-anchor="end">After Mankiw, Principles of Economics, ch. 2. Drawn for LIBEROS.</text>
</svg>
