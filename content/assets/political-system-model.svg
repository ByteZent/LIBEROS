<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
  <title id="t">The political system model: inputs, process functions, outputs and feedback</title>
  <desc id="d">A state drawn as a box inside its environment of other states and international institutions. Inputs (demands and support) enter from the left. Inside the state, actors (citizens, parties, interest groups, social movements, media, parliament, government, administration, courts) carry four process functions in sequence: interest articulation, interest aggregation, policy-making and implementation. Outputs (laws, decisions, services) leave on the right and perform policy functions: extracting resources, regulating behaviour, distributing goods and services. A dashed feedback arrow leads from the outputs back to the inputs. After Easton and Almond and Powell.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9d1d9"/>
    </marker>
    <marker id="arr-bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fb3c8"/>
    </marker>
    <style>
      .panel { fill: #0d1117; }
      .env { fill: none; stroke: #8b97a3; stroke-width: 1.2; stroke-dasharray: 3 5; }
      .st { fill: #161d26; stroke: #7fb3c8; stroke-width: 1.5; }
      .th { fill: #1a2330; stroke: #d4a84b; stroke-width: 1.5; }
      .h { font: 700 15px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #e8edf2; }
      .key { font: 700 13.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #e8edf2; }
      .q { font: italic 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
      .sub { font: 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .ph-ig { font: 700 13px "JetBrains Mono", Menlo, monospace; letter-spacing: 2px; fill: #d4a84b; }
      .ph-bl { font: 700 13px "JetBrains Mono", Menlo, monospace; letter-spacing: 2px; fill: #7fb3c8; }
      .ln { stroke: #c9d1d9; stroke-width: 2; fill: none; }
      .fb { stroke: #7fb3c8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
      text { text-anchor: middle; }
    </style>
  </defs>

  <rect class="panel" x="0" y="0" width="1000" height="600" rx="10"/>

  <!-- Environment -->
  <rect class="env" x="20" y="20" width="960" height="560" rx="10"/>
  <text class="ph-bl" x="500" y="48">ENVIRONMENT</text>
  <text class="sub" x="500" y="68">other states · international and supranational institutions · economy · society</text>

  <!-- State -->
  <rect class="st" x="150" y="90" width="700" height="350" rx="10"/>
  <text class="h" x="500" y="120">POLITICAL SYSTEM OF A STATE</text>
  <text class="sub" x="500" y="146">citizens · parties · interest groups · social movements · media</text>
  <text class="sub" x="500" y="165">parliament · government · administration · courts</text>

  <text class="ph-ig" x="500" y="200">PROCESS FUNCTIONS</text>

  <rect class="th" x="175" y="215" width="145" height="75" rx="6"/>
  <text class="key" x="247" y="244">Interest</text>
  <text class="key" x="247" y="262">articulation</text>
  <text class="q" x="247" y="280">voice a demand</text>

  <rect class="th" x="345" y="215" width="145" height="75" rx="6"/>
  <text class="key" x="417" y="244">Interest</text>
  <text class="key" x="417" y="262">aggregation</text>
  <text class="q" x="417" y="280">bundle into options</text>

  <rect class="th" x="515" y="215" width="145" height="75" rx="6"/>
  <text class="key" x="587" y="253">Policy-making</text>
  <text class="q" x="587" y="280">decide bindingly</text>

  <rect class="th" x="685" y="215" width="145" height="75" rx="6"/>
  <text class="key" x="757" y="253">Implementation</text>
  <text class="q" x="757" y="280">apply and enforce</text>

  <line class="ln" x1="320" y1="252" x2="343" y2="252" marker-end="url(#arr)"/>
  <line class="ln" x1="490" y1="252" x2="513" y2="252" marker-end="url(#arr)"/>
  <line class="ln" x1="660" y1="252" x2="683" y2="252" marker-end="url(#arr)"/>

  <text class="ph-ig" x="500" y="340">POLICY FUNCTIONS</text>
  <text class="sub" x="500" y="364">what the outputs do to society:</text>
  <text class="key" x="500" y="390">extract resources · regulate behaviour · distribute goods and services</text>
  <text class="q" x="500" y="414">taxes, conscription · laws, bans · pensions, schools, security</text>

  <!-- Inputs -->
  <text class="ph-bl" x="85" y="235">INPUTS</text>
  <text class="sub" x="85" y="256">demands</text>
  <text class="sub" x="85" y="273">support</text>
  <line class="ln" x1="128" y1="252" x2="173" y2="252" marker-end="url(#arr)"/>

  <!-- Outputs -->
  <text class="ph-bl" x="915" y="235">OUTPUTS</text>
  <text class="sub" x="915" y="256">laws, decisions</text>
  <text class="sub" x="915" y="273">services</text>
  <line class="ln" x1="830" y1="252" x2="866" y2="252" marker-end="url(#arr)"/>

  <!-- Feedback -->
  <path class="fb" d="M915 290 L915 500 L85 500 L85 290" marker-end="url(#arr-bl)"/>
  <text class="ph-bl" x="500" y="528">FEEDBACK</text>
  <text class="sub" x="500" y="550">outputs change society, and society answers with new demands and more or less support</text>
</svg>
