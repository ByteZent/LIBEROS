  <rect class="box" x="650" y="60" width="320" height="440" rx="10"/>
  <text class="h" x="670" y="92">PRODUCTION POSSIBILITIES</text>
  <text class="item" x="670" y="116">All combinations an economy can</text>
  <text class="item" x="670" y="134">produce with its resources and</text>
  <text class="item" x="670" y="152">technology fully used.</text>
  <text class="lbl" x="670" y="190" fill="#e0915a">A · INSIDE: INEFFICIENT</text>
  <text class="item" x="670" y="210">Attainable, but resources are idle</text>
  <text class="item" x="670" y="228">or badly used (unemployment).</text>
  <text class="lbl" x="670" y="264" fill="#d4a84b">B · ON THE CURVE: EFFICIENT</text>
  <text class="item" x="670" y="284">More of one good only by giving</text>
  <text class="item" x="670" y="302">up some of the other.</text>
  <text class="lbl" x="670" y="338" fill="#c97b84">C · OUTSIDE: UNATTAINABLE</text>
  <text class="item" x="670" y="358">Not possible today. Reachable</text>
  <text class="item" x="670" y="376">after growth (PPF₁).</text>
  <text class="lbl" x="670" y="412" fill="#c9d1d9">SLOPE = OPPORTUNITY COST</text>
  <text class="item" x="670" y="432">The dotted step: one more unit of</text>
  <text class="item" x="670" y="450">butter costs the guns given up.</text>
  <text class="item" x="670" y="478"><tspan fill="#8fc59b">– – PPF₁:</tspan> more resources / technology</text>
  <text class="src" x="970" y="540" text-anchor="end">After Mankiw, Principles of Economics, ch. 2. Drawn for LIBEROS.</text>
</svg>
