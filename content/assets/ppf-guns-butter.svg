  <text class="cv" x="508.0" y="446.0" text-anchor="start" style="fill:#7fb3c8">PPF₀</text>
  <text class="cv" x="571.0" y="442.0" text-anchor="start" style="fill:#8fc59b">PPF₁</text>
  <path d="M350.0 282.7 H400.0 V311.3" stroke="#c9d1d9" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
  <text class="sub" x="375.0" y="274.7" text-anchor="middle">+1 butter</text>
  <text class="sub" x="406.0" y="301.0" text-anchor="start">−0.7 guns</text>
  <circle cx="250.0" cy="358.0" r="6" fill="#e0915a"/>
