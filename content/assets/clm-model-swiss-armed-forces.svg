<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="t d">
  <title id="t">The leadership model of the Swiss Armed Forces (CLM)</title>
  <desc id="d">A disc in three sectors, read from the centre outwards in six rings. Ring 1, orientation: organisation, people (Mensch), mission (Auftrag). Ring 2, leading: Management, Leadership, Command. Ring 3, education: order (Ordnung), values (Werte), purpose (Sinn). Ring 4, training: sureness in procedure, in behaviour, in action. Ring 5, where it is established: processes and structures, culture, doctrine. Outer ring: organisational challenges and institutional approaches, human challenges and communal approaches, challenges of substance and conceptual approaches. After Hofstetter (2023, 2025).</desc>
