<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t d">
  <title id="t">Systems of government: who elects whom, and who can remove whom</title>
  <desc id="d">Four panels. Parliamentary: the people elect parliament; parliament elects the government and can remove it by a vote of no confidence. Presidential: the people elect parliament and the president separately for fixed terms; neither can remove or dissolve the other. Semi-presidential: the people elect parliament and the president; the president appoints the prime minister and cabinet, which parliament can remove; the president can dissolve parliament. Switzerland: the people elect parliament, parliament elects the seven-member Federal Council but cannot remove it, and the citizens also decide issues directly in popular votes.</desc>
  <defs>
    <marker id="m-el" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7fb3c8"/></marker>
    <marker id="m-rm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <marker id="m-ds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d4a84b"/></marker>
    <marker id="m-vt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7fc8a0"/></marker>
    <style>
      .panel { fill: #0d1117; }
      .box { fill: #161d26; stroke: #3a4654; stroke-width: 1.5; }
      .core { font: 700 14px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #c9d1d9; }
      .h { font: 700 13px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #7fb3c8; }
      .h-ig { font: 700 13px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #d4a84b; }
      .big { font: 600 16px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #e8edf2; }
      .lbl { font: 600 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #e8edf2; }
      .item { font: 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
      .sub { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .q { font: italic 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #e8edf2; }

      .ppl { fill: #1a2330; stroke: #c9d1d9; stroke-width: 1.5; }
      .iss { fill: #16221d; stroke: #7fc8a0; stroke-width: 1.2; }
      .a-el { stroke: #7fb3c8; stroke-width: 2; fill: none; }
      .a-rm { stroke: #e07a5f; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .a-ds { stroke: #d4a84b; stroke-width: 2; fill: none; stroke-dasharray: 2 4; }
      .a-vt { stroke: #7fc8a0; stroke-width: 2; fill: none; }
      .sep { stroke: #3a4654; stroke-width: 1.5; stroke-dasharray: 3 4; }
    </style>
  </defs>
  <rect class="panel" x="0" y="0" width="1000" height="480" rx="10"/>
  <text class="core" x="500" y="44" text-anchor="middle">SYSTEMS OF GOVERNMENT: WHO ELECTS, WHO CAN REMOVE</text>
  <rect class="box" x="40" y="70" width="218" height="352" rx="8"/>
  <text class="h" x="149" y="97" text-anchor="middle">PARLIAMENTARY</text>
  <rect class="box" x="50" y="150" width="80" height="44" rx="6"/>
  <text class="lbl" x="90.0" y="176.5" text-anchor="middle">Parliament</text>
  <path class="a-el" d="M125 290 L92 197" marker-end="url(#m-el)"/>
  <rect class="box" x="168" y="150" width="80" height="44" rx="6"/>
  <text class="lbl" x="208.0" y="176.5" text-anchor="middle">Government</text>
  <path class="a-el" d="M130 162 L165 162" marker-end="url(#m-el)"/>
  <path class="a-rm" d="M130 182 L165 182" marker-end="url(#m-rm)"/>
  <rect class="ppl" x="89" y="290" width="120" height="36" rx="6"/>
  <text class="lbl" x="149.0" y="312.5" text-anchor="middle">People</text>
  <text class="sub" x="149" y="356" text-anchor="middle">Only parliament is elected.</text>
  <text class="sub" x="149" y="373" text-anchor="middle">The government comes out of it</text>
  <text class="sub" x="149" y="390" text-anchor="middle">and needs its confidence.</text>
  <text class="sub" x="149" y="407" text-anchor="middle">UK · Germany</text>
  <rect class="box" x="274" y="70" width="218" height="352" rx="8"/>
  <text class="h" x="383" y="97" text-anchor="middle">PRESIDENTIAL</text>
  <rect class="box" x="284" y="150" width="80" height="44" rx="6"/>
  <text class="lbl" x="324.0" y="176.5" text-anchor="middle">Parliament</text>
  <path class="a-el" d="M359 290 L326 197" marker-end="url(#m-el)"/>
  <rect class="box" x="402" y="150" width="80" height="44" rx="6"/>
  <text class="lbl" x="442.0" y="176.5" text-anchor="middle">President</text>
  <path class="a-el" d="M407 290 L440 197" marker-end="url(#m-el)"/>
  <path class="sep" d="M383 140 L383 204"/>
  <rect class="ppl" x="323" y="290" width="120" height="36" rx="6"/>
  <text class="lbl" x="383.0" y="312.5" text-anchor="middle">People</text>
  <text class="sub" x="383" y="356" text-anchor="middle">Both are elected, for fixed terms.</text>
  <text class="sub" x="383" y="373" text-anchor="middle">Neither can remove</text>
  <text class="sub" x="383" y="390" text-anchor="middle">or dissolve the other.</text>
  <text class="sub" x="383" y="407" text-anchor="middle">United States</text>
  <rect class="box" x="508" y="70" width="218" height="352" rx="8"/>
  <text class="h" x="617" y="97" text-anchor="middle">SEMI-PRESIDENTIAL</text>
  <rect class="box" x="518" y="150" width="80" height="44" rx="6"/>
  <text class="lbl" x="558.0" y="176.5" text-anchor="middle">Parliament</text>
  <path class="a-el" d="M593 290 L560 197" marker-end="url(#m-el)"/>
  <rect class="box" x="636" y="112" width="80" height="40" rx="6"/>
  <text class="lbl" x="676.0" y="128.5" text-anchor="middle">PM +</text>
  <text class="lbl" x="676.0" y="144.5" text-anchor="middle">cabinet</text>
  <rect class="box" x="636" y="190" width="80" height="40" rx="6"/>
  <text class="lbl" x="676.0" y="214.5" text-anchor="middle">President</text>
  <path class="a-el" d="M653 290 L674 233" marker-end="url(#m-el)"/>
  <path class="a-el" d="M676 190 L676 155" marker-end="url(#m-el)"/>
  <path class="a-rm" d="M598 160 L633 140" marker-end="url(#m-rm)"/>
  <path class="a-ds" d="M636 204 L601 184" marker-end="url(#m-ds)"/>
  <rect class="ppl" x="557" y="290" width="120" height="36" rx="6"/>
  <text class="lbl" x="617.0" y="312.5" text-anchor="middle">People</text>
  <text class="sub" x="617" y="356" text-anchor="middle">President and prime minister</text>
  <text class="sub" x="617" y="373" text-anchor="middle">share executive power. The</text>
  <text class="sub" x="617" y="390" text-anchor="middle">cabinet answers to parliament.</text>
  <text class="sub" x="617" y="407" text-anchor="middle">France · Austria</text>
  <rect class="box" x="742" y="70" width="218" height="352" rx="8"/>
  <text class="h" x="851" y="97" text-anchor="middle">SWITZERLAND</text>
  <rect class="box" x="752" y="150" width="80" height="44" rx="6"/>
  <text class="lbl" x="792.0" y="176.5" text-anchor="middle">Parliament</text>
  <path class="a-el" d="M827 290 L794 197" marker-end="url(#m-el)"/>
  <rect class="box" x="870" y="150" width="80" height="44" rx="6"/>
  <text class="lbl" x="910.0" y="168.5" text-anchor="middle">Federal</text>
  <text class="lbl" x="910.0" y="184.5" text-anchor="middle">Council</text>
  <path class="a-el" d="M832 172 L867 172" marker-end="url(#m-el)"/>
  <rect class="iss" x="866" y="236" width="84" height="30" rx="6"/>
  <text class="lbl" x="908.0" y="255.5" text-anchor="middle">Issues</text>
  <path class="a-vt" d="M882 290 L900 269" marker-end="url(#m-vt)"/>
  <rect class="ppl" x="791" y="290" width="120" height="36" rx="6"/>
  <text class="lbl" x="851.0" y="312.5" text-anchor="middle">People</text>
  <text class="sub" x="851" y="356" text-anchor="middle">Parliament elects seven equals,</text>
  <text class="sub" x="851" y="373" text-anchor="middle">but cannot remove them.</text>
  <text class="sub" x="851" y="390" text-anchor="middle">Citizens also vote on issues.</text>
  <text class="sub" x="851" y="407" text-anchor="middle">Fits neither main type</text>
  <path class="a-el" d="M70 452 L114 452" marker-end="url(#m-el)"/>
  <text class="item" x="124" y="456">elects / appoints</text>
  <path class="a-rm" d="M290 452 L334 452" marker-end="url(#m-rm)"/>
  <text class="item" x="344" y="456">can remove (no confidence)</text>
  <path class="a-ds" d="M560 452 L604 452" marker-end="url(#m-ds)"/>
  <text class="item" x="614" y="456">can dissolve</text>
  <path class="a-vt" d="M740 452 L784 452" marker-end="url(#m-vt)"/>
  <text class="item" x="794" y="456">decides directly</text>
</svg>
