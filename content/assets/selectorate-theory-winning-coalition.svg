<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 486" width="1000" height="486" role="img" aria-labelledby="t d">
  <title id="t">Selectorate theory: selectorate, winning coalition and the cost of private and public goods</title>
  <desc id="d">Left: two sets of nested circles. In a democracy the winning coalition W is a large part of the selectorate S, which is most of the residents. In an autocracy W is a very small circle inside S. Right: a cost diagram. Public goods cost a fixed 1 billion francs whatever the size of W. Private goods cost W times 2,000 francs and rise with W. A junta with W of 100 (the horizontal axis is not to scale) pays 200,000 francs, a one-party regime with W of 10,000 pays 20 million, a democracy with W of 2 million would pay 4 billion. The lines cross at W of 500,000: below it private goods are cheaper, above it public goods are.</desc>
  <defs>
    <marker id="m-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b97a3"/></marker>
    <marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7fb3c8"/></marker>
    <marker id="m-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d4a84b"/></marker>
    <marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7fc8a0"/></marker>
    <marker id="m-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <style>
      .panel { fill: #0d1117; }
      .box { fill: #161d26; stroke: #3a4654; stroke-width: 1.5; }
      .box-b { fill: #161d26; stroke: #7fb3c8; stroke-width: 1.5; }
      .box-a { fill: #1a2330; stroke: #d4a84b; stroke-width: 2; }
      .box-g { fill: #1a2330; stroke: #7fc8a0; stroke-width: 2; }
      .box-r { fill: #161d26; stroke: #e07a5f; stroke-width: 1.5; }
      .core { font: 700 14px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #c9d1d9; }
      .h { font: 700 13px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #7fb3c8; }
      .h-ig { font: 700 13px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #d4a84b; }
      .h-g { font: 700 13px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #7fc8a0; }
      .h-r { font: 700 13px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #e07a5f; }
      .big { font: 600 16px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #e8edf2; }
      .lbl { font: 600 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #e8edf2; }
      .item { font: 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
      .sub { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .q { font: italic 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #e8edf2; }
      .axis { stroke: #8b97a3; stroke-width: 1.5; fill: none; }
      .ln-b { stroke: #7fb3c8; stroke-width: 2.5; fill: none; }
      .ln-a { stroke: #d4a84b; stroke-width: 2.5; fill: none; }
      .ln-r { stroke: #e07a5f; stroke-width: 2.5; fill: none; }
      .ln-g { stroke: #7fc8a0; stroke-width: 2.5; fill: none; }
      .ghost { stroke: #5a6673; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
      .lbl-b { font: 600 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #7fb3c8; }
      .lbl-r { font: 600 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #e07a5f; }
      .arr { stroke: #8b97a3; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="panel" x="0" y="0" width="1000" height="486" rx="10"/>
  <text class="core" x="500" y="44" text-anchor="middle">SELECTORATE THEORY: THE SIZE OF W DECIDES</text>

  <rect class="box" x="30" y="66" width="470" height="374" rx="10"/>
  <text class="h" x="150" y="96" text-anchor="middle">DEMOCRACY</text>
  <circle cx="150" cy="235" r="105" fill="#111821" stroke="#3a4654" stroke-width="1.5" stroke-dasharray="7 5"/>
  <circle cx="150" cy="245" r="88" fill="#161d26" stroke="#7fb3c8" stroke-width="1.5"/>
  <circle cx="150" cy="262" r="58" fill="#1a2330" stroke="#d4a84b" stroke-width="2"/>
  <text class="sub" x="150" y="146" text-anchor="middle">residents</text>
  <text class="h" x="150" y="182" text-anchor="middle">S</text>
  <text class="h-ig" x="150" y="258" text-anchor="middle">W</text>
  <text class="sub" x="150" y="276" text-anchor="middle">large</text>

  <text class="h-r" x="385" y="96" text-anchor="middle">AUTOCRACY</text>
  <circle cx="385" cy="235" r="105" fill="#111821" stroke="#3a4654" stroke-width="1.5" stroke-dasharray="7 5"/>
  <circle cx="385" cy="245" r="78" fill="#161d26" stroke="#7fb3c8" stroke-width="1.5"/>
  <circle cx="385" cy="262" r="15" fill="#1a2330" stroke="#d4a84b" stroke-width="2"/>
  <text class="sub" x="385" y="146" text-anchor="middle">residents</text>
  <text class="h" x="385" y="200" text-anchor="middle">S</text>
  <text class="h-ig" x="385" y="267" text-anchor="middle">W</text>
  <text class="sub" x="385" y="296" text-anchor="middle">small</text>

  <text class="lbl" x="48" y="372">S</text><text class="item" x="64" y="372">selectorate: everyone with a say in who rules</text>
  <text class="lbl" x="48" y="394">W</text><text class="item" x="64" y="394">winning coalition: those whose support keeps the ruler in power</text>
  <text class="sub" x="48" y="420">Each member of W must be paid, or changes to a rival.</text>

  <rect class="box" x="520" y="66" width="450" height="374" rx="10"/>
  <text class="h-ig" x="745" y="96" text-anchor="middle">THE RULER'S ARITHMETIC</text>
  <line class="axis" x1="560" y1="370" x2="950" y2="370" marker-end="url(#m-gr)"/>
  <line class="axis" x1="560" y1="370" x2="560" y2="112" marker-end="url(#m-gr)"/>
  <text class="sub" x="570" y="124">cost of staying in power</text>
  <text class="sub" x="945" y="390" text-anchor="end">size of W →</text>
  <line class="ln-b" x1="560" y1="230" x2="940" y2="230"/>
  <text class="lbl-b" x="572" y="222">public goods: fixed, CHF 1 bn</text>
  <line class="ln-r" x1="570" y1="360" x2="940" y2="120"/>
  <text class="lbl-r" x="572" y="192">private goods: W × CHF 2,000</text>
  <line class="ghost" x1="770" y1="230" x2="770" y2="370"/>
  <circle cx="770" cy="230" r="5" fill="#d4a84b"/>
  <text class="h-ig" x="770" y="390" text-anchor="middle">W = 500,000</text>
  <circle cx="600" cy="340.5" r="5" fill="#e07a5f"/>
  <text class="item" x="612" y="352">junta, W = 100</text>
  <text class="item" x="612" y="366">CHF 200,000</text>
  <circle cx="680" cy="288.6" r="5" fill="#e07a5f"/>
  <text class="item" x="692" y="304">one party</text>
  <text class="item" x="692" y="319">W = 10,000</text>
  <text class="item" x="692" y="334">CHF 20 m</text>
  <circle cx="880" cy="158.9" r="5" fill="#e07a5f"/>
  <text class="item" x="866" y="150" text-anchor="end">democracy, W = 2 m:</text>
  <text class="item" x="850" y="167" text-anchor="end">CHF 4 bn</text>
  <text class="sub" x="664" y="414" text-anchor="middle">private goods cheaper</text>
  <text class="sub" x="860" y="414" text-anchor="middle">public goods cheaper</text>
  <line class="arr" x1="760" y1="424" x2="580" y2="424" marker-end="url(#m-gr)"/>
  <line class="arr" x1="780" y1="424" x2="940" y2="424" marker-end="url(#m-gr)"/>

  <text class="q" x="500" y="466" text-anchor="middle">Not good or bad rulers, but the size of the winning coalition decides which goods are provided.</text>
</svg>
