<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">Movement along vs shift of the demand curve</title>
  <desc id="d">Left: a change in the good's own price moves buyers along a given demand curve from point A to point B; the quantity demanded changes. Right: a change in any other determinant, such as income or tastes, shifts the whole demand curve from D0 to D1; demand changes, so at every price buyers want more.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6773"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9d1d9"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7fb3c8"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fc59b"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4a84b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c97b84"/></marker>
    <style>
      .panel { fill: #0d1117; }
      .box { fill: #161d26; stroke: #3a4654; stroke-width: 1.5; }
      .axis { stroke: #5b6773; stroke-width: 1.5; fill: none; }
      .guide { stroke: #5b6773; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
      .d { stroke: #7fb3c8; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .s { stroke: #8fc59b; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .old { stroke-dasharray: 7 6; opacity: .55; }
      .h { font: 700 15px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.5px; fill: #e8edf2; }
      .lbl { font: 600 11.5px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.2px; }
      .ax { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .cv { font: italic 700 14px "IBM Plex Serif", Georgia, serif; }
      .tk { font: italic 13px "IBM Plex Serif", Georgia, serif; fill: #c9d1d9; }
      .item { font: 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
      .sub { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .res { font: 700 13px "JetBrains Mono", Menlo, monospace; fill: #d4a84b; }
      .src { font: italic 11px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #5b6773; }
    </style>
  </defs>
  <rect class="panel" width="1000" height="560" rx="14"/>
  <path class="axis" d="M90 440 V98" marker-end="url(#ax)"/>
  <path class="axis" d="M90 440 H432" marker-end="url(#ax)"/>
  <text class="ax" x="82" y="90">Price P</text>
  <text class="ax" x="432" y="462" text-anchor="end">Quantity Q</text>
  <path class="d" d="M109.8 158.8 L403.5 393.8"/>
  <text class="cv" x="409.5" y="397.8" fill="#7fb3c8">D</text>
  <path class="guide" d="M90 209.0 H172.5 V440"/>
  <circle cx="172.5" cy="209.0" r="5" fill="#d4a84b"/>
  <text class="tk" x="82" y="213.0" text-anchor="end">P₁</text>
  <text class="tk" x="172.5" y="458" text-anchor="middle">Q₁</text>
  <path class="guide" d="M90 341.0 H337.5 V440"/>
  <circle cx="337.5" cy="341.0" r="5" fill="#d4a84b"/>
  <text class="tk" x="82" y="345.0" text-anchor="end">P₂</text>
  <text class="tk" x="337.5" y="458" text-anchor="middle">Q₂</text>
  <text class="cv" x="180.5" y="201.0" text-anchor="start" fill="#d4a84b">A</text>
  <text class="cv" x="345.5" y="333.0" text-anchor="start" fill="#d4a84b">B</text>
  <path d="M187.3 241.3 L297.8 329.7" stroke="#d4a84b" stroke-width="2" fill="none" marker-end="url(#ae)"/>
  <path class="axis" d="M580 440 V98" marker-end="url(#ax)"/>
  <path class="axis" d="M580 440 H922" marker-end="url(#ax)"/>
  <text class="ax" x="572" y="90">Price P</text>
  <text class="ax" x="922" y="462" text-anchor="end">Quantity Q</text>
  <path class="d old" d="M586.6 201.1 L862.8 422.0"/>
  <text class="cv" x="868.8" y="418.0" fill="#7fb3c8" opacity=".6">D₀</text>
  <path class="d" d="M626.2 127.2 L910.0 354.2"/>
  <text class="cv" x="916.0" y="348.2" fill="#7fb3c8">D₁</text>
  <path d="M604.8 209.0 L717.0 209.0" stroke="#7fb3c8" stroke-width="1.8" fill="none" marker-end="url(#ad)"/>
  <path d="M687.2 275.0 L799.5 275.0" stroke="#7fb3c8" stroke-width="1.8" fill="none" marker-end="url(#ad)"/>
  <path d="M769.8 341.0 L881.9 341.0" stroke="#7fb3c8" stroke-width="1.8" fill="none" marker-end="url(#ad)"/>
  <text class="h" x="90" y="48">MOVEMENT ALONG THE CURVE</text>
  <text class="sub" x="90" y="70">The good's own price changes → the <tspan fill="#c9d1d9" font-weight="700">quantity demanded</tspan> changes.</text>
  <text class="h" x="580" y="48">SHIFT OF THE CURVE</text>
  <text class="sub" x="580" y="70">Something else changes (income, tastes …) → <tspan fill="#c9d1d9" font-weight="700">demand</tspan> changes.</text>
  <line x1="500" y1="36" x2="500" y2="500" stroke="#3a4654" stroke-width="1"/>
  <text class="item" x="90" y="500">Price falls from P₁ to P₂: buyers slide from A to B.</text>
  <text class="item" x="580" y="500">At <tspan font-style="italic">every</tspan> price, buyers now want more.</text>
  <text class="src" x="970" y="536" text-anchor="end">After Mankiw, Principles of Economics, ch. 4. Drawn for LIBEROS. The same logic holds for supply.</text>
</svg>
