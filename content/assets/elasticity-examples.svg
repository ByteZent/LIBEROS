<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-labelledby="t d">
  <title id="t">Price elasticity of demand for eight goods</title>
  <desc id="d">Horizontal bar chart. Inelastic demand, below 1: eggs 0.1, healthcare 0.2, cigarettes 0.4, rice 0.5, housing 0.7. Elastic demand, above 1: beef 1.6, peanut butter 1.7, Mountain Dew 4.4. Eggs have no close substitute, Mountain Dew has many.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6773"/></marker>
    <style>
      .panel { fill: #0d1117; }
      .box { fill: #161d26; stroke: #3a4654; stroke-width: 1.5; }
      .axis { stroke: #5b6773; stroke-width: 1.5; fill: none; }
      .guide { stroke: #5b6773; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
      .grid { stroke: #3a4654; stroke-width: 1; fill: none; }
      .d { stroke: #7fb3c8; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .s { stroke: #8fc59b; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .h { font: 700 15px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.5px; fill: #e8edf2; }
      .lbl { font: 600 11.5px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.2px; }
      .ax { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .cv { font: italic 700 14px "IBM Plex Serif", Georgia, serif; }
      .tk { font: italic 13px "IBM Plex Serif", Georgia, serif; fill: #c9d1d9; }
      .item { font: 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
      .sub { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .res { font: 700 13px "JetBrains Mono", Menlo, monospace; fill: #d4a84b; }
      .src { font: italic 11px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #5b6773; }
    </style>
  </defs>
  <rect class="panel" width="1000" height="510" rx="14"/>
  <text class="h" x="30" y="52">PRICE ELASTICITY OF DEMAND: EXAMPLES</text>
  <path class="grid" d="M520 104 V415"/>
  <path class="grid" d="M680 104 V415"/>
  <path class="grid" d="M840 104 V415"/>
  <text class="item" x="188" y="127.5" text-anchor="end">Eggs</text>
  <rect x="200" y="112" width="16" height="22" rx="3" fill="#7fb3c8"/>
  <text class="tk" x="224" y="127.5">0.1</text>
  <text class="item" x="188" y="165.5" text-anchor="end">Healthcare</text>
  <rect x="200" y="150" width="32" height="22" rx="3" fill="#7fb3c8"/>
  <text class="tk" x="240" y="165.5">0.2</text>
  <text class="item" x="188" y="203.5" text-anchor="end">Cigarettes</text>
  <rect x="200" y="188" width="64" height="22" rx="3" fill="#7fb3c8"/>
  <text class="tk" x="272" y="203.5">0.4</text>
  <text class="item" x="188" y="241.5" text-anchor="end">Rice</text>
  <rect x="200" y="226" width="80" height="22" rx="3" fill="#7fb3c8"/>
  <text class="tk" x="288" y="241.5">0.5</text>
  <text class="item" x="188" y="279.5" text-anchor="end">Housing</text>
  <rect x="200" y="264" width="112" height="22" rx="3" fill="#7fb3c8"/>
  <text class="tk" x="320" y="279.5">0.7</text>
  <text class="item" x="188" y="317.5" text-anchor="end">Beef</text>
  <rect x="200" y="302" width="256" height="22" rx="3" fill="#c97b84"/>
  <text class="tk" x="464" y="317.5">1.6</text>
  <text class="item" x="188" y="355.5" text-anchor="end">Peanut butter</text>
  <rect x="200" y="340" width="272" height="22" rx="3" fill="#c97b84"/>
  <text class="tk" x="480" y="355.5">1.7</text>
  <text class="item" x="188" y="393.5" text-anchor="end">Mountain Dew</text>
  <rect x="200" y="378" width="704" height="22" rx="3" fill="#c97b84"/>
  <text class="tk" x="912" y="393.5">4.4</text>
  <text class="sub" x="252" y="127.5">no close substitute</text>
  <text class="item" x="212" y="393.5" style="fill:#0d1117;font-weight:600">many close substitutes</text>
  <path d="M360 100 V415" stroke="#d4a84b" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <text class="lbl" x="352" y="92" text-anchor="end" style="fill:#7fb3c8">INELASTIC  (&lt; 1)</text>
  <text class="lbl" x="368" y="92" style="fill:#c97b84">ELASTIC  (&gt; 1)</text>
  <path class="axis" d="M200 104 V415 H936"/>
  <text class="tk" x="200" y="435" text-anchor="middle">0</text>
  <text class="tk" x="360" y="435" text-anchor="middle" style="fill:#d4a84b">1</text>
  <text class="tk" x="520" y="435" text-anchor="middle">2</text>
  <text class="tk" x="680" y="435" text-anchor="middle">3</text>
  <text class="tk" x="840" y="435" text-anchor="middle">4</text>
  <text class="ax" x="936" y="459" text-anchor="end">Price elasticity of demand</text>
  <text class="src" x="970" y="492" text-anchor="end">Estimates as listed in Mankiw, Principles of Economics, ch. 5. Other studies report other values. Drawn for LIBEROS.</text>
</svg>
