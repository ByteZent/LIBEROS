<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">Market equilibrium, surplus and shortage</title>
  <desc id="d">A downward-sloping demand curve D and an upward-sloping supply curve S cross at equilibrium E with price P* and quantity Q*. At a price P1 above P*, quantity supplied exceeds quantity demanded: a surplus, which pushes the price down. At a price P2 below P*, quantity demanded exceeds quantity supplied: a shortage, which pushes the price up.</desc>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6773"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9d1d9"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7fb3c8"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fc59b"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4a84b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c97b84"/></marker>
    <style>
      .panel { fill: #0d1117; }
      .box { fill: #161d26; stroke: #3a4654; stroke-width: 1.5; }
      .axis { stroke: #5b6773; stroke-width: 1.5; fill: none; }
      .guide { stroke: #5b6773; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
      .d { stroke: #7fb3c8; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .s { stroke: #8fc59b; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .old { stroke-dasharray: 7 6; opacity: .55; }
      .h { font: 700 15px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.5px; fill: #e8edf2; }
      .lbl { font: 600 11.5px "JetBrains Mono", Menlo, monospace; letter-spacing: 1.2px; }
      .ax { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .cv { font: italic 700 14px "IBM Plex Serif", Georgia, serif; }
      .tk { font: italic 13px "IBM Plex Serif", Georgia, serif; fill: #c9d1d9; }
      .item { font: 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
      .sub { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .res { font: 700 13px "JetBrains Mono", Menlo, monospace; fill: #d4a84b; }
      .src { font: italic 11px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #5b6773; }
    </style>
  </defs>
  <rect class="panel" width="1000" height="560" rx="14"/>
  <path class="axis" d="M90 470 V58" marker-end="url(#ax)"/>
  <path class="axis" d="M90 470 H622" marker-end="url(#ax)"/>
  <text class="ax" x="82" y="50">Price P</text>
  <text class="ax" x="622" y="492" text-anchor="end">Quantity Q</text>
  <path class="d" d="M121.2 129.2 L584.0 414.0"/>
  <text class="cv" x="590.0" y="418.0" fill="#7fb3c8">D</text>
  <path class="s" d="M110.8 417.2 L584.0 126.0"/>
  <text class="cv" x="590.0" y="126.0" fill="#8fc59b">S</text>
  <path d="M90 174.0 H506.0" stroke="#c97b84" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M194.0 174.0 H506.0" stroke="#c97b84" stroke-width="5" opacity=".75"/>
  <path d="M90 366.0 H506.0" stroke="#7fb3c8" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M194.0 366.0 H506.0" stroke="#7fb3c8" stroke-width="5" opacity=".75"/>
  <text class="tk" x="82.0" y="178.0" text-anchor="end">P₁</text>
  <text class="tk" x="82.0" y="370.0" text-anchor="end">P₂</text>
  <text class="lbl" x="350.0" y="162.0" text-anchor="middle" fill="#c97b84">SURPLUS</text>
  <text class="lbl" x="350.0" y="390.0" text-anchor="middle" fill="#7fb3c8">SHORTAGE</text>
  <path d="M573.6 182.0 L573.6 246.0" stroke="#c97b84" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M573.6 358.0 L573.6 294.0" stroke="#7fb3c8" stroke-width="2" fill="none" marker-end="url(#ad)"/>
  <path class="guide" d="M90 270.0 H350.0 V470"/>
  <circle cx="350.0" cy="270.0" r="5" fill="#d4a84b"/>
  <text class="tk" x="82" y="274.0" text-anchor="end">P*</text>
  <text class="tk" x="350.0" y="488" text-anchor="middle">Q*</text>
  <text class="cv" x="346.0" y="256.0" text-anchor="start" fill="#d4a84b">E</text>
  <rect class="box" x="660" y="60" width="310" height="440" rx="10"/>
  <text class="h" x="680" y="92">EQUILIBRIUM</text>
  <text class="item" x="680" y="118">Where the curves cross,</text>
  <text class="item" x="680" y="136">Q<tspan font-size="9" dy="3">D</tspan><tspan dy="-3">(P*) = Q</tspan><tspan font-size="9" dy="3">S</tspan><tspan dy="-3">(P*) = Q*</tspan></text>
  <text class="item" x="680" y="154">No buyer or seller wants to change.</text>
  <text class="lbl" x="680" y="196" fill="#c97b84">PRICE ABOVE P*: SURPLUS</text>
  <text class="item" x="680" y="218">Sellers offer more than buyers</text>
  <text class="item" x="680" y="236">take. Unsold stock piles up, so</text>
  <text class="item" x="680" y="254">sellers cut the price.</text>
  <text class="lbl" x="680" y="296" fill="#7fb3c8">PRICE BELOW P*: SHORTAGE</text>
  <text class="item" x="680" y="318">Buyers want more than is offered.</text>
  <text class="item" x="680" y="336">Queues form, buyers bid up</text>
  <text class="item" x="680" y="354">the price.</text>
  <text class="lbl" x="680" y="396" fill="#d4a84b">EITHER WAY</text>
  <text class="item" x="680" y="418">The price moves toward P* until</text>
  <text class="item" x="680" y="436">the gap closes: the "law of</text>
  <text class="item" x="680" y="454">supply and demand".</text>
  <text class="src" x="970" y="536" text-anchor="end">After Mankiw, Principles of Economics, ch. 4. Drawn for LIBEROS.</text>
</svg>
