  <text class="cv" x="611.2" y="345.1" fill="#8fc59b">I₃</text>
  <path class="d" d="M90.0 90.0 L550.0 470.0"/>
  <path class="guide" d="M90 280.0 H320.0 V470"/>
  <circle cx="320.0" cy="280.0" r="5" fill="#d4a84b"/>
  <text class="lbl" x="332.0" y="270.0" style="fill:#d4a84b">OPTIMUM</text>
  <circle cx="412.0" cy="263.7" r="4" fill="#c97b84"/>
  <text class="item" x="422.0" y="255.7" style="fill:#c97b84">preferred, not affordable</text>
  <circle cx="167.4" cy="154.0" r="4" fill="#8b97a3"/>
  <text class="item" x="177.4" y="156.0" style="fill:#8b97a3">affordable, but worse</text>
  <text class="tk" x="82" y="94.0" text-anchor="end">500</text>
  <text class="tk" x="82" y="284.0" text-anchor="end">250</text>
  <text class="tk" x="320.0" y="488" text-anchor="middle">50</text>
  <text class="tk" x="550.0" y="488" text-anchor="middle">100</text>
  <text class="item" x="458.0" y="441.1" text-anchor="end" style="fill:#7fb3c8">budget constraint</text>
  <rect class="box" x="660" y="60" width="310" height="440" rx="10"/>
  <text class="h" x="680" y="92">BEST AFFORDABLE BUNDLE</text>
  <text class="lbl" x="680" y="122" fill="#7fb3c8">BUDGET CONSTRAINT</text>
  <text class="item" x="680" y="148">What she can afford: income 1,000,</text>
  <text class="item" x="680" y="166">pizza 10, cola 2. Slope = relative</text>
  <text class="item" x="680" y="184">price: 1 pizza costs 5 litres.</text>
  <text class="lbl" x="680" y="216" fill="#8fc59b">INDIFFERENCE CURVES</text>
  <text class="item" x="680" y="242">What she wants: bundles on one</text>
  <text class="item" x="680" y="260">curve are equally good, higher</text>
  <text class="item" x="680" y="278">curves are better. Slope = marginal</text>
  <text class="item" x="680" y="296">rate of substitution (MRS).</text>
  <text class="lbl" x="680" y="328" fill="#d4a84b">OPTIMUM</text>
  <text class="item" x="680" y="354">The highest curve that still touches</text>
  <text class="item" x="680" y="372">the budget line. There the two</text>
  <text class="item" x="680" y="390">slopes are equal:</text>
  <text class="item" x="680" y="408">MRS = relative price.</text>
  <text class="src" x="970" y="536" text-anchor="end">After Mankiw, Principles of Economics, ch. 21. Drawn for LIBEROS.</text>
</svg>
