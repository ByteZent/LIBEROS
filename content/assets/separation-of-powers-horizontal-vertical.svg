<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
  <title id="t">Separation of powers: horizontal and vertical</title>
  <desc id="d">A grid. Horizontal separation divides state power at one level among legislature, executive and judiciary, which check each other: checks and balances. Vertical separation divides state power between the national level and the member states. In a federal state each member state has its own legislature, executive and judiciary, so the two separations cross. Horizontal separation is strongest in presidential systems and weakest in parliamentary ones. Vertical separation is strong in federal states and weak in unitary states.</desc>
  <defs>
    <marker id="m-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7fb3c8"/></marker>
    <marker id="m-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4a84b"/></marker>
    <marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7fc8a0"/></marker>
    <style>
      .panel { fill: #0d1117; }
      .box-b { fill: #161d26; stroke: #7fb3c8; stroke-width: 1.5; }
      .box-g { fill: #1a2330; stroke: #7fc8a0; stroke-width: 1.5; }
      .core { font: 700 14px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #c9d1d9; }
      .h { font: 700 13px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #7fb3c8; }
      .h-ig { font: 700 13px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #d4a84b; }
      .h-g { font: 700 13px "JetBrains Mono", Menlo, monospace; letter-spacing: 1px; fill: #7fc8a0; }
      .lbl { font: 600 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #e8edf2; }
      .item { font: 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
      .sub { font: 12px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #8b97a3; }
      .q { font: italic 12.5px "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #e8edf2; }
      .ln-b { stroke: #7fb3c8; stroke-width: 2.5; fill: none; }
      .ln-a { stroke: #d4a84b; stroke-width: 2.5; fill: none; }
      .ln-g { stroke: #7fc8a0; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <rect class="panel" x="0" y="0" width="1000" height="470" rx="10"/>
  <text class="core" x="500" y="44" text-anchor="middle">SEPARATION OF POWERS: HORIZONTAL AND VERTICAL</text>

  <text class="h" x="590" y="82" text-anchor="middle">HORIZONTAL SEPARATION</text>
  <text class="sub" x="590" y="100" text-anchor="middle">among the three powers of one level</text>
  <line class="ln-b" x1="214" y1="116" x2="966" y2="116" marker-start="url(#m-b)" marker-end="url(#m-b)"/>

  <text class="h-g" x="34" y="262" text-anchor="middle" transform="rotate(-90 34 262)">VERTICAL SEPARATION</text>
  <text class="sub" x="52" y="262" text-anchor="middle" transform="rotate(-90 52 262)">between the levels of the state</text>
  <line class="ln-g" x1="72" y1="144" x2="72" y2="380" marker-start="url(#m-g)" marker-end="url(#m-g)"/>

  <text class="lbl" x="92" y="180">National level</text>
  <text class="sub" x="92" y="198">Confederation,</text>
  <text class="sub" x="92" y="214">Bund</text>
  <rect class="box-b" x="210" y="140" width="220" height="84" rx="8"/>
  <rect class="box-b" x="480" y="140" width="220" height="84" rx="8"/>
  <rect class="box-b" x="750" y="140" width="220" height="84" rx="8"/>
  <text class="lbl" x="320" y="172" text-anchor="middle">Legislature</text>
  <text class="item" x="320" y="192" text-anchor="middle">parliament</text>
  <text class="sub" x="320" y="210" text-anchor="middle">makes the laws</text>
  <text class="lbl" x="590" y="172" text-anchor="middle">Executive</text>
  <text class="item" x="590" y="192" text-anchor="middle">government, administration</text>
  <text class="sub" x="590" y="210" text-anchor="middle">carries them out</text>
  <text class="lbl" x="860" y="172" text-anchor="middle">Judiciary</text>
  <text class="item" x="860" y="192" text-anchor="middle">courts</text>
  <text class="sub" x="860" y="210" text-anchor="middle">judges by them</text>
  <line class="ln-a" x1="436" y1="182" x2="474" y2="182" marker-start="url(#m-a)" marker-end="url(#m-a)"/>
  <line class="ln-a" x1="706" y1="182" x2="744" y2="182" marker-start="url(#m-a)" marker-end="url(#m-a)"/>

  <text class="h-ig" x="590" y="258" text-anchor="middle">CHECKS AND BALANCES</text>
  <text class="sub" x="590" y="276" text-anchor="middle">no holder of power can change the political system alone</text>

  <text class="lbl" x="92" y="336">Member states</text>
  <text class="sub" x="92" y="354">cantons,</text>
  <text class="sub" x="92" y="370">Länder</text>
  <rect class="box-g" x="210" y="300" width="220" height="80" rx="8"/>
  <rect class="box-g" x="480" y="300" width="220" height="80" rx="8"/>
  <rect class="box-g" x="750" y="300" width="220" height="80" rx="8"/>
  <text class="lbl" x="320" y="336" text-anchor="middle">Legislature</text>
  <text class="item" x="320" y="356" text-anchor="middle">cantonal parliament</text>
  <text class="lbl" x="590" y="336" text-anchor="middle">Executive</text>
  <text class="item" x="590" y="356" text-anchor="middle">cantonal government</text>
  <text class="lbl" x="860" y="336" text-anchor="middle">Judiciary</text>
  <text class="item" x="860" y="356" text-anchor="middle">cantonal courts</text>
  <line class="ln-a" x1="436" y1="340" x2="474" y2="340" marker-start="url(#m-a)" marker-end="url(#m-a)"/>
  <line class="ln-a" x1="706" y1="340" x2="744" y2="340" marker-start="url(#m-a)" marker-end="url(#m-a)"/>

  <text class="item" x="590" y="414" text-anchor="middle">Horizontal: strongest in presidential systems (separated), weakest in parliamentary ones (fused).</text>
  <text class="item" x="590" y="434" text-anchor="middle">Vertical: strong in federal states, weak in unitary states.</text>
  <text class="q" x="590" y="456" text-anchor="middle">In a federal state the two cross: every level has its own three powers.</text>
</svg>
