# More names by which `make watch` finds the country of a headline, on top of watch/gazetteer.json
# (countries and capitals in English and German, written by `make worldmap`).
# Matched as whole words, in this spelling: "Turkey" is the state, "turkey" is not.
#
#   CODE: [name, …]   ISO 3166-1 alpha-3
#   ignore: [name, …] names of the gazetteer that mislead more often than they help

ignore: [Georgia, Jordan, Chad, Male, Victoria, Kingston, Saint George's, Roseau, Vaduz City]

