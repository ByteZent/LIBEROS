# The feeds `make watch` reads (scripts/watch.mjs) into the stream of the Current Affairs map.
#
#   tier   primary    governments and organisations speaking for themselves
#          analysis   think tanks and specialist press
#          data       data sets and their release notes
#   lang   the feed's language when it is not English (shown next to the source)
#   domain the domain of an item whose words give none away (optional)

# days an item stays in the stream
keep: 14

# true: the public site shows the stream too. The deployment then has to run `make watch` before
# the build, because the items are not in the repository.
public: false

# Words to watch for that have no note yet. An item naming one is listed as linked, under the term.
terms: []

sources:
  # ── primary ────────────────────────────────────────────────────────────────
  - name: UN Press
    tier: primary
    url: https://press.un.org/en/rss.xml
  - name: UN News (Peace and Security)
    tier: primary
    url: https://news.un.org/feed/subscribe/en/news/topic/peace-and-security/feed/rss.xml
